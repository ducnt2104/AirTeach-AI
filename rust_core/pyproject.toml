[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "airteach-core-rs"
version = "2.0.0"
description = "Optional Rust PyO3 geometry and vector math acceleration for AirTeach AI"
requires-python = ">=3.11"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "airteach_core_rs"
