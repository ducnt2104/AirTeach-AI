<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" width="680" height="180">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a73e8"/>
      <stop offset="50%" stop-color="#137333"/>
      <stop offset="100%" stop-color="#8e24aa"/>
    </linearGradient>
  </defs>
  <!-- Step 1: 1€ Filter -->
  <rect x="10" y="20" width="190" height="130" rx="10" fill="#ffffff" stroke="#1a73e8" stroke-width="2.5"/>
  <text x="105" y="50" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="14" fill="#1a73e8">1. Lọc Rung Thời Gian Thực</text>
  <text x="105" y="75" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#5f6368">Bộ lọc thích ứng 1€ Filter</text>
  <text x="105" y="95" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#3c4043">fc = 1.0Hz + β·|dx/dt|</text>
  <text x="105" y="125" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="11" fill="#137333">Độ trễ &lt; 1ms</text>

  <!-- Arrow 1 -->
  <path d="M205 85h25m0 0l-6-6m6 6l-6 6" fill="none" stroke="#5f6368" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Step 2: RDP + Bézier -->
  <rect x="240" y="20" width="190" height="130" rx="10" fill="#ffffff" stroke="#137333" stroke-width="2.5"/>
  <text x="335" y="50" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="14" fill="#137333">2. Làm Mịn Hậu Kỳ</text>
  <text x="335" y="75" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#5f6368">Ramer–Douglas–Peucker</text>
  <text x="335" y="95" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#3c4043">Cubic Bézier Spline C¹</text>
  <text x="335" y="125" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="11" fill="#137333">Biến thiên nét theo tốc độ</text>

  <!-- Arrow 2 -->
  <path d="M435 85h25m0 0l-6-6m6 6l-6 6" fill="none" stroke="#5f6368" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Step 3: Shape Snapping -->
  <rect x="470" y="20" width="190" height="130" rx="10" fill="#ffffff" stroke="#8e24aa" stroke-width="2.5"/>
  <text x="565" y="50" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="14" fill="#8e24aa">3. Nắn Hình Học Tự Động</text>
  <text x="565" y="75" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#5f6368">Phân tích Convex Hull</text>
  <text x="565" y="95" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#3c4043">Line, Circle, Rect, Tri</text>
  <text x="565" y="125" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="11" fill="#8e24aa">Chuyển sang Vector chuẩn</text>
</svg>